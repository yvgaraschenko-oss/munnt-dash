<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Склади та АЗС</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #f6f5f3; }
  @media (prefers-color-scheme: dark) { html, body { background: #1b1b1b; } }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<iframe id="f" title="Склади та АЗС" allow="clipboard-write"></iframe>
<script>
  var APP = 'https://script.google.com/macros/s/AKfycbzu35Dugsk8E9AyBOFwdf36g50Kid5TYJfPw9tQI357o8NrphiWQNq3G0qcrMsRpult/exec';
  var t = new URLSearchParams(location.search).get('t') || '';
  document.getElementById('f').src = APP + (t ? '?t=' + encodeURIComponent(t) : '');
  try { Telegram.WebApp.ready(); Telegram.WebApp.expand(); } catch (e) {}
</script>
</body>
</html>
